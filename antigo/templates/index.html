<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Separador de Feijões Interativo</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <style>
        /* Reset básico */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            margin: 20px;
        }

        /* Títulos */
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        h3 {
            text-align: center;
            color: #34495e;
            margin-top: 30px;
        }

        /* Formulário */
        form#beanForm {
            background-color: #ffffff;
            padding: 20px 25px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        form#beanForm label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
        }

        form#beanForm input[type="number"],
        form#beanForm input[type="file"] {
            width: 100%;
            padding: 8px 10px;
            margin-top: 4px;
            margin-bottom: 4px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        form#beanForm button {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        form#beanForm button:hover {
            background-color: #2980b9;
        }

        /* Resultado */
        #resultado {
            margin: 0 auto;
        }

        #resultado img {
            display: block;
            margin: 20px auto;
            border-radius: 8px;
            border: 2px solid #ccc;
        }

        /* Tabela DataTable */
        .dataTables_wrapper {
            overflow-x: auto;
            max-width: 100%;
            background-color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
        }

        table.dataTable {
            width: 100% !important;
            min-width: 600px;
            border-collapse: collapse;
        }

        table.dataTable thead th {
            background-color: #2980b9;
            color: white;
            font-weight: 600;
            text-align: center;
        }

        table.dataTable tbody td {
            text-align: center;
        }

        div[id^="feijoes_table"] div {
            margin: 0 auto;
        }

        /* Responsividade */
        @media(max-width: 768px) {

            form#beanForm,
            #resultado {
                width: 90%;
            }

            table.dataTable thead th,
            table.dataTable tbody td {
                font-size: 12px;
                padding: 6px;
            }
        }
    </style>

</head>

<body>
    <h2>Separador de Feijões</h2>

    <form id="beanForm">
        <form id="beanForm" enctype="multipart/form-data">
            <label>Escolher imagens (múltiplas): <input type="file" name="imagens" multiple></label><br><br>
            <label>Área mínima (px): <input type="number" name="min_area" value="500"></label><br><br>
            <label>Circularidade mínima: <input type="number" step="0.01" name="min_circularidade"
                    value="0.5"></label><br><br>
            <label>Número de cores por feijão: <input type="number" name="n_cores" value="2"></label><br><br>
            <label>Pixels a analisar: <input type="number" name="pix_analisar" value="2000"></label><br><br>
            <button type="submit">Executar</button>
            <div id="progress-container" style="display:none; margin-top:20px;">
                <p id="progress-text">Processando...</p>
                <div style="background-color:#eee; width:100%; border-radius:10px; overflow:hidden;">
                    <div id="progress-bar" style="width:0%; height:20px; background-color:#3498db;"></div>
                </div>
            </div>
        </form>

        <div id="resultado" style="margin-top:20px;"></div>

        <script>
            $('#beanForm').on('submit', function (e) {
                e.preventDefault();
                var formData = new FormData(this);

                // Desativa o botão
                $('button[type="submit"]').prop('disabled', true);
                $('#progress-container').show();
                $('#progress-bar').css('width', '0%');
                $('#progress-text').text('Iniciando processamento...');

                $.ajax({
                    url: "/processar",
                    type: "POST",
                    data: formData,
                    contentType: false,
                    processData: false,
                    xhr: function () {
                        var xhr = new window.XMLHttpRequest();
                        xhr.upload.addEventListener("progress", function (evt) {
                            if (evt.lengthComputable) {
                                var percentComplete = evt.loaded / evt.total * 50; // upload até 50%
                                $('#progress-bar').css('width', percentComplete + '%');
                                $('#progress-text').text('Upload: ' + Math.round(percentComplete * 2) + '%');
                            }
                        }, false);
                        return xhr;
                    },
                    success: function (response) {
                        // Simula progressão final (50%-100%) durante processamento
                        var percent = 50;
                        var interval = setInterval(function () {
                            percent += 5;
                            if (percent > 100) percent = 100;
                            $('#progress-bar').css('width', percent + '%');
                            $('#progress-text').text('Processando feijões... ' + percent + '%');

                            if (percent === 100) {
                                clearInterval(interval);

                                // Limpa resultado anterior
                                var html = "<h3>Imagens Processadas:</h3>";

                                // Mostra todas as imagens processadas com nome
                                response.imagens.forEach(function (imgObj) {
                                    html += '<div style="text-align:center;margin-bottom:30px;">';
                                    html += '<img src="' + imgObj.data + '" style="max-width:800px;border:1px solid #ccc;border-radius:8px;"><br>';
                                    html += '<span style="font-weight:bold;color:#555;">' + imgObj.nome + '</span>';
                                    html += '</div>';
                                });

                                // Adiciona tabela única
                                html += response.tabela;

                                $('#resultado').html(html);
                                $('#feijoes_table').DataTable({ "pageLength": 25 });
                                $('#progress-container').fadeOut();
                                $('button[type="submit"]').prop('disabled', false);
                            }
                        }, 200);
                    },
                    error: function () {
                        alert("Ocorreu um erro no processamento.");
                        $('#progress-container').fadeOut();
                        $('button[type="submit"]').prop('disabled', false);
                    }
                });
            });
        </script>

</body>

</html>
